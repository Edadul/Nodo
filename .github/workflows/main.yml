name: Tests

on:
  push:
  pull_request:
    branches: [main]

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/unit

  widget:
    name: Pruebas de widgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/widget

  # Pruebas previas del equipo en la raíz de test/ (reglas de negocio con
  # FakeDatabase y algunas pantallas).
  root:
    name: Pruebas de la raíz de test/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/*_test.dart

  integration:
    name: Pruebas de integración (Chrome headless)
    runs-on: ubuntu-latest
    # Las más lentas: solo corren si las rápidas pasan.
    needs: [unit, widget, root]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # La imagen de ubuntu-latest trae Chrome y un chromedriver de la misma
      # versión en $CHROMEWEBDRIVER.
      - name: Iniciar chromedriver
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          sleep 3

      - name: Ejecutar pruebas de integración
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/app_test.dart
          -d web-server
          --browser-name=chrome
          --headless
